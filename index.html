<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="keywords" content="翔宇达,国际物流,翔宇达国际物流,一级货运代理公司,国际航空业务,PO航空美国总代">
    <meta name="description" content="深圳市翔宇达运通国际货运代理有限公司，是专业从事全球性国际货物运输的一级货运代理公司，国际航空业务，PO航空美国总代。">
    <meta name="format-detection" content="telephone=no">
    <title>Loading...</title>
    <script>
      // 后台管理页面立即设置标题（不依赖 API），前端展示页面由 Vue 路由守卫动态设置
      (function() {
        var path = window.location.pathname;
        var adminTitles = {
          '/admin': '后台管理',
          '/admin/site-info': '站点信息 - 后台管理',
          '/admin/navigation': '导航栏管理 - 后台管理',
          '/admin/carousel': '轮播图管理 - 后台管理',
          '/admin/system-settings': '系统设置 - 后台管理'
        };

        if (adminTitles[path]) {
          document.title = adminTitles[path];
        }
        // 前端展示页面保持 Loading...，等 Vue 加载导航数据后由路由守卫设置正确标题
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/tinymce/tinymce.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
