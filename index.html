<html lang="zh-CN">

      // 根据当前路径立即设置标题，避免刷新时闪烁
      (function() {

        const routeTitles = {
          '/admin': '后台管理',
          '/admin/site-info': '站点信息 - 后台管理',
          '/admin/navigation': '导航栏管理 - 后台管理',

          '/aboutus': '关于我们 - 深圳市翔宇达运通国际货运代理有限公司',
          '/business': '主营渠道 - 深圳市翔宇达运通国际货运代理有限公司',
          '/business-1': '空派专线 - 深圳市翔宇达运通国际货运代理有限公司',

          '/news': '新闻中心 - 深圳市翔宇达运通国际货运代理有限公司',
          '/news-1': '公司新闻 - 深圳市翔宇达运通国际货运代理有限公司',
          '/news-2': '行业动态 - 深圳市翔宇达运通国际货运代理有限公司',
          '/news-search': '搜索结果 - 新闻中心 - 深圳市翔宇达运通国际货运代理有限公司',
          '/help': '帮助中心 - 深圳市翔宇达运通国际货运代理有限公司',
          '/faq': '常见问题 - 深圳市翔宇达运通国际货运代理有限公司',
          '/help-search': '搜索结果 - 帮助中心 - 深圳市翔宇达运通国际货运代理有限公司',
          '/contact': '联系我们 - 深圳市翔宇达运通国际货运代理有限公司'
        };

        // 检查是否匹配到路由标题
        if (routeTitles[path]) {
          document.title = routeTitles[path];
        } else if (path.startsWith('/news_ds-')) {
          document.title = '新闻详情 - 深圳市翔宇达运通国际货运代理有限公司';
        } else if (path.startsWith('/arts-')) {
          document.title = '帮助中心 - 深圳市翔宇达运通国际货运代理有限公司';
        } else if (path.startsWith('/arts_ds')) {
          document.title = '帮助详情 - 深圳市翔宇达运通国际货运代理有限公司';
        }
        // 首页和其他未匹配的路径保持默认标题
      })();
