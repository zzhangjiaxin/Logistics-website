<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>地图</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
#map{width:100%;height:100%;}
</style>
<script src="https://api.map.baidu.com/api?v=3.0&ak=t9FBGNZrpsqSODP8gN7ewK3LA4f8JByK"></script>
</head>
<body>
<div id="map"></div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var point = params.get('point');
  var name = params.get('name') || '';
  if(!point) return;
  var parts = point.split(',');
  var lng = parseFloat(parts[0]);
  var lat = parseFloat(parts[1]);
  if(isNaN(lng)||isNaN(lat)) return;

  var map = new BMap.Map('map');
  var center = new BMap.Point(lng, lat);
  map.centerAndZoom(center, 16);
  map.enableScrollWheelZoom(true);

  var marker = new BMap.Marker(center);
  map.addOverlay(marker);

  if(name){
    var label = new BMap.Label(name, {offset: new BMap.Size(20, -10)});
    label.setStyle({
      color:'#333',
      fontSize:'14px',
      padding:'5px 10px',
      border:'1px solid #ccc',
      backgroundColor:'#fff',
      borderRadius:'3px'
    });
    marker.setLabel(label);
  }
})();
</script>
</body>
</html>
